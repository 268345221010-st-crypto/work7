<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact</title>

  <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="bg-blue-600 text-white p-4">

    <div class="container mx-auto flex justify-between">

      <h1 class="text-2xl font-bold">
        Contact
      </h1>

      <ul class="flex gap-4">

        <li><a href="index.html">Home</a></li>

        <li><a href="activities.html">Activities</a></li>

        <li><a href="about.html">About</a></li>

        <li><a href="contact.html">Contact</a></li>

      </ul>

    </div>

  </nav>

  <!-- CONTACT -->
  <section class="container mx-auto text-center py-24">

    <h2 class="text-5xl font-bold mb-8">

      Contact Us

    </h2>

    <button
      onclick="openModal()"
      class="bg-blue-600 text-white px-10 py-4 rounded-2xl text-xl hover:bg-blue-700 hover:scale-105 duration-300">

      Open Modal

    </button>

  </section>

  <!-- MODAL -->
  <div
    id="modal"
    class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">

    <div
      class="bg-white p-10 rounded-3xl w-80 text-center animate-bounce">

      <h2 class="text-3xl font-bold mb-4">

        Contact Information

      </h2>

      <p class="mb-6">

        student@email.com

      </p>

      <button
        onclick="closeModal()"
        class="bg-red-500 text-white px-6 py-3 rounded-xl">

        Close

      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
